<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
  <div class="flex flex-column align-items-center justify-content-center">
    <img src="assets/logo/Logo_Target/logo_para_fundo_claro.png" alt="Sakai logo" class="mb-5 w-15rem flex-shrink-0">
    <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 243, 163, 0) 30%);">
      <div class="w-full surface-card pt-7 pb-7 px-5 sm:px-8" style="border-radius: 53px">
        <div class="col-12">
          <div class="tel-label">Digite abaixo o número do código enviado:</div>
          <div style="text-align: center; width: 316px;">
            <input
              formControlName="codigo"
              id="cod"
              type="text"
              placeholder="Digite o número do código"
              pInputText
              class="custom-input"
              maxlength="4"
            />
          </div>
          <div style="text-align: center;">
            <button
              class="bt-getIn"
              (click)="login()"
            ><span class="tel-input-label">Entrar</span></button>
          </div>
        </div>

        <div class="col-12 mt-4 my-2" style="text-align: center;">
          <span class="desc-label">
            Não recebi nenhum código!
          </span>
        </div>

        <div style="text-align: center;">
          <div style="color: #82A126; font-size: 16px; font-family: Inter; font-weight: 700; text-decoration: underline; word-wrap: break-word">Enviar novamente</div>
        </div>

      </div>
    </div>
  </div>
</div>
<p-toast></p-toast>
